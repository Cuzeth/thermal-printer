name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Pytest
        run: pytest

      - name: Auth flow smoke
        env:
          DRY_RUN: "true"
          ADMIN_TOKEN: ci-token
          DATA_DIR: /tmp/tp-ci
        run: python scripts/test_auth_flow.py
