<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>thermal printer</title>
  <meta name="theme-color" content="#202321" />
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml" />
  <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="admin-login">
  <main class="login-spread tgrid">
    <div class="login-art" aria-hidden="true">
      <div class="kicker"><span class="idx">00</span><span class="t-label">private access</span></div>
      <div class="login-display">ADMIN</div>
    </div>
    <span class="rail" aria-hidden="true"></span>
    <form class="login-card cut" id="login-form">
      <span class="panel-tab" aria-hidden="true">auth / 00</span>
      <span class="login-eyebrow">authenticator</span>
      <h1>Thermal console</h1>
      <p id="code-help">six-digit code from your authenticator app</p>
      <label class="sr-only" for="code">authenticator code</label>
      <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code"
             pattern="[0-9]*" maxlength="6" placeholder="000000" aria-describedby="code-help login-err" autofocus />
      <button id="login-btn" class="signal" type="submit">unlock console</button>
      <div id="login-err" role="alert"></div>
    </form>
  </main>

  <script>
    const form = document.getElementById("login-form");
    const code = document.getElementById("code");
    const btn = document.getElementById("login-btn");
    const err = document.getElementById("login-err");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = "";
      btn.disabled = true;
      try {
        const r = await fetch("/api/admin/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: code.value }),
        });
        const j = await r.json().catch(() => ({ ok: false, error: "bad response" }));
        if (!j.ok) throw new Error(j.error || `HTTP ${r.status}`);
        // Session cookie is set — reload and the server serves the console.
        location.reload();
      } catch (ex) {
        err.textContent = ex.message;
        code.select();
        btn.disabled = false;
      }
    });

    // Submit as soon as six digits are in — one less button press.
    code.addEventListener("input", () => {
      if (code.value.length === 6) form.requestSubmit();
    });
  </script>
</body>
</html>
