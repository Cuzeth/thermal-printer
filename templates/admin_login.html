<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thermal Printer Console</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="admin-login">
  <div class="login-wrap">
    <form class="login-card" id="login-form">
      <span class="logo" aria-hidden="true">&#9626;&#9626;</span>
      <span class="login-eyebrow">Owner access</span>
      <h1>THERMAL // CONSOLE</h1>
      <p id="code-help">Enter the current six-digit code from your authenticator app.</p>
      <label class="sr-only" for="code">Authenticator code</label>
      <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code"
             pattern="[0-9]*" maxlength="6" placeholder="000000" aria-describedby="code-help login-err" autofocus />
      <button id="login-btn" class="primary" type="submit">Unlock console</button>
      <div id="login-err" role="alert"></div>
      <div class="login-security"><span aria-hidden="true">●</span> Private owner session · expires after 12 hours</div>
    </form>
  </div>

  <script>
    const form = document.getElementById("login-form");
    const code = document.getElementById("code");
    const btn = document.getElementById("login-btn");
    const err = document.getElementById("login-err");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = "";
      btn.disabled = true;
      try {
        const r = await fetch("/api/admin/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: code.value }),
        });
        const j = await r.json().catch(() => ({ ok: false, error: "bad response" }));
        if (!j.ok) throw new Error(j.error || `HTTP ${r.status}`);
        // Session cookie is set — reload and the server serves the console.
        location.reload();
      } catch (ex) {
        err.textContent = ex.message;
        code.select();
        btn.disabled = false;
      }
    });

    // Submit as soon as six digits are in — one less button press.
    code.addEventListener("input", () => {
      if (code.value.length === 6) form.requestSubmit();
    });
  </script>
</body>
</html>
