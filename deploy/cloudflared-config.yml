# Cloudflare Tunnel config — the only door to the app.
# cloudflared dials out to Cloudflare's edge, so no router config or open
# ports are needed; it proxies requests to Flask on 127.0.0.1:5005.
#
# One hostname, one trust level: everything at print.cuzeth.com is
# internet-facing and the app defends itself. Friends sign in with a
# username + password (session cookie); the owner unlocks /admin with a
# TOTP code (or curls /api/admin/* with the Bearer ADMIN_TOKEN). There is
# no Cloudflare Access application, no identity headers, and no path
# allowlist anymore — auth lives entirely in the app.
#
# SECURITY: Flask must stay bound to 127.0.0.1 so the tunnel is the only
# way in. The login rate limiters resolve the client address from the
# last X-Forwarded-For hop, which is only trustworthy when Cloudflare's
# edge is the one that appended it.
#
# Install: DEPLOY.md walks through creating the tunnel, filling in
# TUNNEL_ID (both places), and installing this file at
# /etc/cloudflared/config.yml as a systemd service. Keep the deployed
# copy identical to this file apart from the placeholders.

tunnel: TUNNEL_ID
credentials-file: /home/pi/.cloudflared/TUNNEL_ID.json

ingress:
  - hostname: print.cuzeth.com
    service: http://127.0.0.1:5005
  - service: http_status:404
